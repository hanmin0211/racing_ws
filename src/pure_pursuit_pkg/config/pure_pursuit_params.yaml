# pure_pursuit_params.yaml
# ==========================
# 현재 파이프라인(local_pure_pursuit_node)용 파라미터.
# 실차 튜닝 시 이 값들을 바꿔가며 재실행하세요.
#
# 데이터 흐름: /local_path(base_link, local_sliding_window 생성) + /odometry/filtered
#   → local_pure_pursuit → /cmd_vel(linear.x=속도[m/s], angular.z=조향각[도, 좌+/우−])
#   → serial_bridge → "VEL:x,STEER:y" → henes_firmware
#
# ※ 구버전(gps_local_realtime_node / pure_pursuit_node / /vehicle_local_pose / /drive)은
#   폐기됨. 그 설정을 여기서 제거함.

local_pure_pursuit:
  ros__parameters:
    # ---- 차량 제원 ----
    wheelbase: 0.785                 # HENES T870 브룬 축거 실측 (m)
    # 실사용 최대 타각. 물리 한계는 20°지만 그 지점에서 포텐셔미터가 ADC 0으로
    # 포화(위치 피드백 상실 + 엔드스톱 컷)하므로 18°로 제한해 벼랑 끝을 피한다.
    # 펌웨어 STEER_MAX_ANGLE(20.0)은 캘리브 기준값이라 그대로 두어야 매핑이 맞는다.
    # ※ 18°의 최소 회전반경 = 2.42m (축거 0.785m) → 경로 최소 반경 2.8m 이상 권장
    max_steering_deg: 18.0
    # ---- lookahead (속도비례) ----
    k_ld: 0.8
    # 1.0 → 1.8: 짧은 lookahead 는 조향이 흔들리고 경로를 물결치듯 따라간다.
    # ★ 2026-08-23 실차 로그 근거로 2.3 → 1.6.
    #   충주 트랙 1랩(4595샘플) 구간별 |cte| 를 보니 직진은 0.03~0.14m 로 매우 좋은데
    #   R=3.03m 급커브(idx160~179)에서만 0.87m 벗어나고, 그 뒤 직선에서도 1.08m 가
    #   회복되지 않았다. lookahead 2.3m 가 커브반경 3.03m 에 육박해 코너를 늦게 물고
    #   복귀도 느렸던 것. 속도 0.7m/s 에선 k_ld*v=0.56 이라 항상 min 값이 적용된다.
    #   ※ 너무 줄이면 직진이 흔들린다. 직진이 이미 안정적이므로 1.6 에서 시작해
    #     다음 주행 로그로 재판단할 것.
    min_lookahead: 1.6
    max_lookahead: 4.0
    # ---- 속도 ----
    target_speed: 0.5                # FF 미보정이라 실제는 이보다 빠르게 나온다
    min_speed: 0.4
    # 2.0 → 6.0: 첫 실주행에서 코너 진입이 빨랐다. FF 미보정 상태라
    # 실제 속도가 명령보다 높게 나오므로 감속을 더 강하게 건다.
    curvature_speed_gain: 6.0        # v = target/(1+gain·|κ|)
    # ---- 토픽/제어 ----
    local_path_topic: "/local_path"
    odom_topic: "/odometry/filtered"
    cmd_topic: "/cmd_vel"
    control_rate: 20.0
    path_timeout: 0.5                # 초; 이보다 오래 경로 없으면 정지
    # ---- 조향 슬루레이트 (부드러운 sweep / 조향모터 보호) ----
    # 90 → 60: 급조향 억제(조향모터 부하·오버슈트 감소)
    max_steer_rate_deg: 45.0         # 60→45: 조향을 더 부드럽게(지그재그 억제)
