# 로컬 좌표계 원점 — 이 파일이 유일한 정본(single source of truth).
#
# 모든 노드(direct_localization / waypoint_recorder / stop_point_recorder)와
# bringup 런치가 이 값을 읽는다. 여기만 고치면 전부 따라온다.
#
# ★ 왜 파일 하나로 묶었나
#   예전엔 이 값이 5곳에 하드코딩돼 있었다(런치 2개, 레코더 2개, pure_pursuit).
#   장소가 바뀔 때 하나라도 빠뜨리면 오차가 아니라 **150km 어긋난다**.
#   실제로 2026-08-17 현장에서 원점이 충주(36.9707,127.8749)로 남아 있어
#   대구권 시험장에서 로컬좌표가 x=78019, y=-127771 로 찍혔다.
#   계산은 차량기준 변환 덕에 멀쩡했지만 RViz 로는 경로를 볼 수 없었다.
#
# ★ 원점을 바꾸면 기존 웨이포인트 YAML 도 같이 옮겨야 한다:
#     python3 tools/shift_waypoints.py <파일> --from-origin <옛x> <옛y>
#
# ★ 값 고르는 법
#   시험장/대회장 안의 아무 지점이나 UTM 좌표를 적당히 내림한 값.
#   경로 전체가 0~수백 m 범위에 들어오면 된다.
#     python3 -c "from pyproj import Transformer; \
#       print(Transformer.from_crs('EPSG:4326','EPSG:32652',always_xy=True) \
#             .transform(<경도>, <위도>))"

site: "대구권 시험장 (2026-08-17 측정)"

# UTM 52N (EPSG:32652)
utm_epsg: 32652
origin_x: 477800.0
origin_y: 3964400.0

# 참고: 위 원점의 위경도 ≈ 35.82348, 128.75423
#       2026-08-17 GPS 실측지점(35.8238397, 128.7549788)은 이 원점 기준
#       약 x=+67.8, y=+37.7 에 위치한다.
