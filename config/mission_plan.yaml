# 미션 계획 — 용인운전면허시험장 (HL FMA 2026)
# ====================================================================
# 코스 위 어디서 어떤 미션을 켤지. 이 파일만 갈아끼우면 코드는 안 바뀐다.
#
# ★ 2026-09-10: 대구 보관본과 분리했다.
#   이전에는 이 자리에 대구(184m) 계획이 있었다. 용인(648m) 웨이포인트로
#   주행하면 후진주차 트리거 s_enter=175m 가 **용인 코스 한복판**에 떨어져
#   주행 중간에 후진 기동이 시작된다 → 이탈 = **탈락**.
#   대구 보관본: config/daegu_2026-08-17/mission_plan.yaml
#
# ★ 안전장치 (mission_sequencer.check_course)
#   시퀀서가 /global_path 를 받는 즉시 아래 course 항목과 대조한다.
#     · path_length_m  vs 실제 경로 총 길이 (허용 10%)
#     · waypoints      vs 실제로 로드된 웨이포인트 파일명
#   어긋나면 **모든 미션을 건너뛰고 자율 완주만** 한다.
#   미션을 못 켜면 감점이고, 엉뚱한 데서 켜면 탈락이기 때문이다.
#
# ★ 값 정하는 법 (현장)
#   python3 tools/mission_s.py --waypoints config/yongin_2026-09-05/wp_yongin_drive_0.5.yaml \
#       --live --name <미션명>
#   미션 지점에 차를 세우고 실행하면 그 자리의 s 가 찍힌다.
#   s_enter 는 미션 구간보다 **넉넉히 앞**에 둔다(감속·정렬 시간).
#   그 다음 tools/test_mission_sequencer.py 로 순서를 확인한다.
#
# ★ enabled
#   false = 계획에는 남기되 이번 주행에서는 안 켠다.
#   현장에서 s 를 실측해 채운 **뒤에** true 로 바꾼다.
#   s 를 모르는 채로 켜는 것이 이 대회에서 가장 비싼 실수다(탈락).
#
# ★ critical
#   true  = 못 하면 완주 자체가 위험
#   false = 감점-only. 8분 예산이 모자라면 시퀀서가 건너뛴다.
#           2026 신규 3개(S코스·돌발·신호제어차선)는 전부 감점-only.
#
# ★ timeout_s
#   넘기면 미션을 포기하고 자율 주행으로 복귀한다.
#   **1분 이상 정지는 탈락**이므로 어떤 미션도 60초 근처로 두지 말 것.

course:
  site: "용인운전면허시험장 (2026-09-05 기록)"
  waypoints: "config/yongin_2026-09-05/wp_yongin_drive_0.5.yaml"
  # 실측 648.27m (1298점, 0.5m 간격). 시퀀서가 이 값으로 코스를 대조한다.
  path_length_m: 648.3

missions:
  # ── 후진주차 ──────────────────────────────────────────────────────
  # ★ s 값 근거 (2026-09-10, 계산으로 확정 — 현장 실측 아님)
  #   ~/parking_spur_yongin.yaml (9/5 기록, 같은 원점계 332200/4128600)의
  #   주차 스퍼를 주행 경로에 투영했다:
  #     스퍼 시작 (24.28, -23.42) → 경로 idx 580, s=289.9m, 이격 0.13m
  #     스퍼 끝   (31.18, -26.36) → 경로 idx 595, s=297.4m, 이격 0.12m
  #     스퍼가 경로에서 최대 12.2m 벗어난다 = 주차칸 안쪽
  #   즉 주차 구간은 **s 290m 부근**이다(대구 계획의 175m 가 아니다).
  #   0.13m 로 붙으므로 위치 자체는 신뢰할 만하지만, 진입 방향·정지 자세는
  #   parking_pose_N.yaml 이 아직 대구 값이라 **현장 실측 전에는 켜지 말 것.**
  - name: parking
    enabled: false          # ← parking_pose 를 용인에서 다시 찍은 뒤 true
    arm_topic: /parking/start
    done_topic: /parking/done
    select_topic: /parking/select
    select_value: 3
    trigger:
      type: course_s
      s_enter: 280.0        # 스퍼 진입(289.9m) 10m 앞 — 감속·정렬 여유
      s_exit:  305.0        # 스퍼 종료(297.4m) 뒤
    timeout_s: 50.0
    expected_s: 45.0
    critical: false

  # ── 횡단보도 / 정지선 ─────────────────────────────────────────────
  #   s 미정. 현장에서 정지선 앞에 세우고 mission_s.py --live --name crosswalk
  - name: crosswalk
    enabled: false
    arm_topic: /crosswalk/arm
    done_topic: /crosswalk/done
    trigger:
      type: course_s
      s_enter: 0.0          # ← 실측값으로 교체 (정지선 11m 앞)
      s_exit:  0.0
    timeout_s: 20.0
    expected_s: 12.0
    critical: false

  # ── 경사로 정지·출발 (규정 항목 3) ────────────────────────────────
  #   규정: 정지검지구역 = 경사로 시작점 1m ~ 정상부 1m.
  #         3초 이상 정지 후 출발 / 후방 50cm 이상 밀리면 5점 /
  #         정지 후 뒷바퀴가 정상부 정지구획선을 30초 이내 통과 못하면 5점.
  #   ★ 새 노드 불필요 — crosswalk_stop_node 와 하는 일이 같다
  #     (정지선 접근 → 완전정지 → dwell → 재출발). 경사로 정지점을
  #     stop_point_recorder 로 찍고 dwell:=3.0 으로 띄운다.
  #   ⚠ timeout_s 는 규정의 30초 상한 안에서 빠져나오도록 30 미만.
  - name: ramp
    enabled: false
    arm_topic: /ramp/arm
    done_topic: /ramp/done
    trigger:
      type: course_s
      s_enter: 0.0
      s_exit:  0.0
    timeout_s: 25.0
    expected_s: 12.0
    critical: false

  # ── 경사로 주행 속도 (배경 기능, 규정 항목 아님) ──────────────────
  # ★ 위 `ramp` 미션(정지·출발)과 **다른 것**이다.
  #   ramp       = 규정 항목. 경사 중턱에 서고 3초 후 출발한다.
  #   ramp_up/down = 그 구간을 **어느 속도로 오르내릴지**. 감점 항목 아님.
  #
  # ★ 왜 필요한가 (2026-09-17 실측)
  #   개루프 FF 는 평지에서 식별한 식이라 중력을 모른다. k=0.0202 기준:
  #       법정 오르막 12.5% → PWM 60 이 통째로 사라진다 (못 올라간다)
  #       법정 내리막  9%   → PWM 44 가 공짜로 붙는다 (계속 빨라진다)
  #   19.3% 시험 경사에서 4km/h 명령이 5.7km/h 로 물렸다.
  #
  # ★ exclusive: false — 배경이다. done 도 timeout 도 없고, 다른 미션을
  #   막지 않는다. 특히 같은 자리의 `ramp`(정지·출발)와 **같이** 켜진다.
  #
  # ★ 안전 (tools/test_ramp_section.py 가 못 박는다)
  #   기준속도만 바꾼다. 곡률·정지선·장애물 감속은 그대로 걸린다.
  #   구간이 잘못 찍혀 R=6.4m 코너에 걸려도 곡률이 1.03 m/s 로 누른다.
  #   시퀀서가 죽으면 1초 뒤 v_max 로 복귀한다.
  #
  # ⚠ 내리막은 **명령을 낮춰도 안 선다** — 중력이 이긴다.
  #   serial_bridge 의 gov_pwm(거버너)·grade_ff(IMU 경사보상)를 같이 켤 것.
  #   grade_ff 는 부호를 현장에서 확정한 뒤에만:
  #       python3 tools/imu_grade.py --level      (평지)
  #       python3 tools/imu_grade.py --measure --expect 12.5   (경사)
  #
  # ⚠ s 를 실측하기 전에는 enabled:false 로 둘 것. 0.0~0.0 은 빈 구간이라
  #   켜도 arm 이 안 나가지만, 잘못 채운 값으로 켜는 것이 가장 비싼 실수다.
  #   python3 tools/mission_s.py --waypoints <용인파일> --live --name ramp_up
  # ★ 2026-09-19 — 이 두 슬롯을 **굴절코스·S자 감속**에 쓴다.
  #   이름이 ramp_up/ramp_down 이지만 기능은 '구간에서 기준속도를 바꾼다' 일
  #   뿐이라 경사로 전용이 아니다. 경사로(s11~54)는 등판에 힘이 필요해서
  #   전역 max_speed 1.6 을 그대로 쓰므로 슬롯이 남는다.
  #
  #   왜 필요한가 (실측 근거):
  #     급커브 자체는 곡률 제한기가 이미 5.0 km/h 로 누른다. 그런데
  #     **커브 사이 직선에서 8.9 km/h 로 튄다.** 구간 전체를 고정해야 한다.
  #       굴절코스  현재 5.0~8.9 km/h (평균 6.9)  →  0.55 적용시 4.8~5.0
  #       S자       현재 5.2~8.9 km/h (평균 6.6)  →  0.55 적용시 4.8~5.0
  #     대가는 완주 +33초 (305s → 338s). 8분 예산에 2.4분 여유가 남는다.
  #
  #   ⚠ 이 차의 **최저 속도는 4.8 km/h** 다 (개루프 PWM 바닥 67).
  #     4 km/h 는 PWM 58 이라 정지마찰을 못 넘어 차가 선다 — 불가능하다.
  #     v_ramp_* 0.55 가 5.0 km/h 이고 그 밑으로는 의미가 없다.
  #
  #   런치 인자 (셋 다 있어야 동작한다):
  #     sequencer:=true
  #     ramp_up_arm_topic:=/ramp/up_arm  ramp_down_arm_topic:=/ramp/down_arm
  #     v_ramp_up:=0.55  v_ramp_down:=0.55      ← 소수점 필수
  #
  #   ⚠ 아래 s 는 **추정값이다.** 현장에서 확정하기 전에는 enabled:false 로 둘 것:
  #     python3 tools/mission_s.py --waypoints config/yongin_2026-09-05/wp_yongin_drive_0.5.yaml --live
  #   틀려도 안전하다(기준속도만 낮춘다). 다만 엉뚱한 데서 느려져 시간만 잃는다.
  - name: ramp_up            # ← 굴절코스 감속
    enabled: false
    arm_topic: /ramp/up_arm
    exclusive: false
    trigger:
      type: course_s
      s_enter: 58.0         # ← 굴절코스 진입 (추정, 현장 확정 필요)
      s_exit:  140.0        # ← 굴절코스 탈출 (추정)
    critical: false

  - name: ramp_down          # ← S자+장애물 감속
    enabled: false
    arm_topic: /ramp/down_arm
    exclusive: false
    trigger:
      type: course_s
      s_enter: 176.0        # ← S자 진입 (추정, 현장 확정 필요)
      s_exit:  250.0        # ← S자 탈출 (추정)
    critical: false

  # ── 신호교차로 (규정 항목 5) ──────────────────────────────────────
  #   규정: 좌회전 포함 1회 이상 / 정지신호에 앞범퍼가 정지선 통과 5점 /
  #         교차로 내 20초 이상 정지 10점 / 30초 이내 통과 못하면 5점.
  #         정지선 직전 1m 내 정지시간은 지정시간에 산입하지 않음.
  #   ⚠ timeout_s 30 미만.
  #   ⚠ 카메라 신호등 판정이 아직 불안정하다(YOLOv8s 재학습 대기).
  #     빨강을 놓치면 정지선 통과 5점, 초록을 빨강으로 보면 교차로 안에서
  #     20초 정지 10점이다. 재학습 전에는 켜지 말 것.
  - name: traffic_light
    enabled: false
    arm_topic: /traffic_light/arm
    done_topic: /traffic_light/done
    trigger:
      type: course_s
      s_enter: 0.0
      s_exit:  0.0
    timeout_s: 28.0
    expected_s: 20.0
    critical: false

  # ── 돌발 급정지 (라이다, 규정 항목 7) ─────────────────────────────
  #   카메라 없이 라이다만으로 된다. /obstacle_distance 로 서는 건
  #   longitudinal 이 이미 하고, 이 노드는 '정지 확인 → 5초 유지 → 재출발'.
  #   ⚠ crosswalk 와 같은 /stop_line_distance 를 쓴다 — 시퀀서가 하나만
  #     arm 하는 것이 전제다. s 구간이 겹치지 않게 할 것.
  #   ★ 규정: "회피기동은 미션 성공으로 인정하지 않음"(10점).
  #     이 구간에서 라이다가 옆으로 돌아 나가면 미션 실패다. 반드시 서야 한다.
  #     → inhibits 로 lidar_avoid 를 명시적으로 막는다.
  - name: sudden_stop
    enabled: true
    arm_topic: /sudden_stop/arm
    done_topic: /sudden_stop/done
    inhibits: [lidar_avoid]
    trigger:
      type: course_s
      s_enter: 470.0
      s_exit: 515.0
    timeout_s: 25.0
    expected_s: 12.0
    critical: false

  # ── 라이다 조향 회피 (배경 기능) ──────────────────────────────────
  # ★ 이 항목이 켜고 끄는 것은 **조향 override 뿐이다.**
  #   전방 장애물 감속·정지(/obstacle_distance)는 안전 기능이라 이 항목과
  #   무관하게 **코스 전체에서 항상 동작한다.** (라이다 노드가 직접 보장)
  #
  # ★ exclusive: false — 구간 미션이 아니라 배경이다. 다른 미션을 막지 않고
  #   done 신호도 타임아웃도 없다. 구간을 벗어나면 조향 회피만 꺼진다.
  #
  # ⚠ 예전 값은 s 0~9999(코스 전체)였다 = 어디서든 조향을 뺏을 수 있다.
  #   S코스가 아닌 곳에서 관중·표지물·연석에 반응해 조향을 틀면 이탈=탈락이다.
  #   시퀀서가 이제 '코스 90% 이상을 덮는 배경 기능'을 거부한다
  #   (trigger 에 allow_full_course: true 를 명시하지 않는 한).
  #   → S코스 구간 s 를 재서 좁힐 것:
  #     python3 tools/mission_s.py --waypoints <용인파일> --live --name s_course
  - name: lidar_avoid
    enabled: true
    arm_topic: /lidar/arm
    exclusive: false
    trigger:
      type: course_s
      s_enter: 12.0          # ← S코스 진입 s
      s_exit: 648.0
      allow_full_course: true          # ← S코스 탈출 s
    critical: false

# ─────────────────────────────────────────────────────────────────────
# 아직 계획에 없는 것 — 현장 확인 후 항목 추가
#   · parking_perp  직각주차 (규정 항목 6)
#   · parking_para  평행주차 (규정 항목 8)
#   두 미션 모두 expected_s 추정치조차 없다. 8분 예산에 반영되지 않은 상태다.
