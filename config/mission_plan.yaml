# 미션 계획 — 코스 위 어디서 어떤 미션을 켤지.
#
# ★ 이 파일만 갈아끼우면 장소가 바뀌어도 코드는 안 바뀐다.
#   미션 노드는 전부 띄워둔 채로 시퀀서가 arm 토픽으로만 켜고 끈다.
#
# ★ 값 정하는 법
#   1) 코스를 한 바퀴 기록해 waypoints 를 만든다
#   2) python3 tools/list_waypoints.py --plot 으로 어디가 어디인지 본다
#   3) 각 미션 구간의 진행거리 s 를 읽어 s_enter / s_exit 에 적는다
#      s_enter 는 **미션 구간보다 넉넉히 앞**에 둔다(감속·정렬 시간).
#   4) tools/test_mission_sequencer.py 로 순서를 확인한다
#
# ★ critical
#   true  = 못 하면 탈락 위험 (완주 자체)
#   false = 감점-only. 8분 예산이 모자라면 시퀀서가 **건너뛴다.**
#           2026 신규 3개(S코스·돌발·신호제어차선)는 전부 감점-only 다.
#
# ★ timeout_s
#   이 시간을 넘기면 미션을 포기하고 자율 주행으로 복귀한다.
#   **1분 이상 정지는 탈락**이므로 어떤 미션도 60초 근처로 두지 말 것.

course:
  site: "대구권 시험장 (2026-08-17) — 용인 기록 후 교체할 것"
  waypoints: "src/pure_pursuit_pkg/config/waypoints_recorded_resampled_0.5.yaml"

missions:
  # ── 횡단보도/정지선 (대구 코스 기준: 정지선이 경로 idx142 ≒ s 71m) ──
  - name: crosswalk
    arm_topic: /crosswalk/arm
    done_topic: /crosswalk/done
    trigger:
      type: course_s
      s_enter: 60.0      # 정지선 11m 앞부터 켠다(감속 여유)
      s_exit:  85.0
    timeout_s: 20.0      # 3초 대기 + 감속·재출발. 여유 두되 60s 근처 금지
    expected_s: 12.0
    critical: false

  # ── 후진주차 (완주 종점) ──
  - name: parking
    arm_topic: /parking/start
    done_topic: /parking/done
    select_topic: /parking/select
    select_value: 3
    trigger:
      type: course_s
      s_enter: 175.0     # 종점(184m) 직전
      s_exit:  200.0
    timeout_s: 50.0
    expected_s: 45.0
    critical: false

  # ── 돌발 급정지 (라이다) ──
  # 카메라 없이 라이다만으로 된다. /obstacle_distance 로 서는 건 longitudinal 이
  # 이미 하고, 이 노드는 '정지 확인 → 5초 유지 → 재출발' 을 맡는다.
  # ⚠ crosswalk 와 같은 /stop_line_distance 를 쓴다 — 시퀀서가 하나만 arm 하는
  #   것이 전제다. s 구간이 겹치지 않게 할 것.
  #
  # ⚠ s 값은 용인 코스 기록 후 채운다:
  #     python3 tools/mission_s.py --waypoints <파일> --live --name sudden_stop
  # - name: sudden_stop
  #   arm_topic: /sudden_stop/arm
  #   done_topic: /sudden_stop/done
  #   # ★ 규정 항목 7: "회피기동은 미션 성공으로 인정하지 않음"(10점).
  #   #   이 구간에서 라이다가 옆으로 돌아 나가면 미션 실패다. 반드시 서야 한다.
  #   inhibits: [lidar_avoid]
  #   trigger: {type: course_s, s_enter: ?, s_exit: ?}
  #   timeout_s: 25.0
  #   expected_s: 12.0
  #   critical: false

  # ── 라이다 조향 회피 (배경 기능) ──
  # ★ 이 항목이 켜고 끄는 것은 **조향 override 뿐이다.**
  #   전방 장애물 감속·정지(/obstacle_distance)는 안전 기능이라 이 항목과
  #   무관하게 **코스 전체에서 항상 동작한다.** (라이다 노드가 직접 보장)
  #
  # ★ exclusive: false — 구간 미션이 아니라 배경이다. 다른 미션을 막지 않고
  #   done 신호도 타임아웃도 없다. 구간을 벗어나면 조향 회피만 꺼진다.
  #
  # ⚠ 지금 s 범위가 코스 전체(0~9999)다 = 어디서든 조향을 뺏을 수 있다.
  #   용인에서 S코스 구간 s 를 알아낸 뒤 **그 구간으로 좁힐 것.**
  #   S코스가 아닌 곳에서 관중·표지물·연석에 반응해 조향을 틀면 이탈=탈락이다.
  #     python3 tools/mission_s.py --waypoints <파일> --live --name s_course
  - name: lidar_avoid
    arm_topic: /lidar/arm
    exclusive: false
    trigger:
      type: course_s
      s_enter: 0.0
      s_exit: 9999.0
    critical: false

# ─────────────────────────────────────────────────────────────────────
# 용인 코스용 뼈대 (9/5 기록 후 s 값을 채운다)
# ─────────────────────────────────────────────────────────────────────
# ── 경사로 정지·출발 (규정 항목 3) ──
#   규정: 정지검지구역은 경사로 시작점 1m 지점 ~ 정상부 1m 지점.
#         3초 이상 정지 후 출발 / 후방 50cm 이상 밀리면 5점 /
#         정지 후 뒷바퀴가 정상부 정지구획선을 **30초 이내** 통과 못하면 5점.
#   ★ 새 노드가 필요 없다 — crosswalk_stop_node 가 하는 일과 같다
#     (정지선 접근 → 완전정지 → dwell → 재출발). 경사로 정지점을
#     stop_point_recorder 로 찍고 dwell:=3.0 으로 띄우면 된다.
#   ⚠ timeout_s 는 30 미만이어야 한다 — 규정의 30초 상한 안에서 빠져나와야 한다.
# - name: ramp
#   arm_topic: /ramp/arm
#   done_topic: /ramp/done
#   trigger: {type: course_s, s_enter: ?, s_exit: ?}
#   timeout_s: 25.0
#   expected_s: 12.0
#   critical: false
#
# ── 신호교차로 (규정 항목 5) ──
#   규정: 좌회전 포함 1회 이상 / 정지신호에 앞범퍼가 정지선 통과 5점 /
#         교차로 내 20초 이상 정지 10점 / 30초 이내 교차로 통과 못하면 5점.
#         신호등에 따라 정지선 직전 1m 내 정지시간은 지정시간에 산입하지 않음.
#   ⚠ timeout_s 를 30 미만으로 — 교차로 안에서 30초를 넘기면 감점이다.
