# mission_plan_school.yaml — 학교 트랙 리허설용 (충주 캠퍼스)
#
# 왜 이 파일이 있나
#   대회에서 실제로 해야 하는 것은 "직선에서 돌발정지 → 3초 이상 서 있다가
#   재출발" 과 "S자에서 경로를 따라가면서 장애물 회피" 다. 그런데 지금까지
#   검증한 것은 **빈 아스팔트에서 장애물 하나** 뿐이고, 미션 체인
#   (시퀀서 → arm → 미션 노드 → done → 다음) 은 실차에서 한 번도 안 돌았다.
#
#   용인 s 값은 9/19 현장에서만 잴 수 있다. 그 전에 **체인 자체**는 학교
#   73m 트랙으로 검증할 수 있다 — s 값만 학교 것으로 바꾸면 구조는 같다.
#
# 학교 트랙 실측 (나갔다 돌아오는 구조):
#     0~10m  직선 — **캘리브 구간. 여기선 미션이 안 돈다**
#                   heading_init 이 /teleop/cmd_vel 로 몰고, 먹스에서 teleop 이
#                   자율보다 우선이라 감속·회피 분기를 아예 안 탄다.
#    10~20m  나가는 직선 (R 45~880)  (비워 둔다 — 캘리브 직후 가속 구간)
#    20~34m  급커브 (s25 에서 R=4.7m)
#    34~42m  커브 탈출 중 (R 7.1 → 13.4 → 38)  ← 여기는 아직 직선이 아니다
#    42~55m  **진짜 직선** (R 38~205)  ← 회피·돌발정지를 둘 다 여기 둔다
#    55~73m  R 7~9m 커브 — '완만' 하지 않다. 미션을 두지 않는다.
#
# ⚠ 2026-09-13 곡률 실측으로 위 표를 고쳤다. 이전 인계문서는 35~55 를 직선,
#   55~73 을 '완만한 커브' 라고 적었는데 둘 다 틀렸다. 특히 55~73 은 R 7~9m
#   라서 거기서 돌발정지를 시험하면 **커브 한복판에서 감지·정지**하게 되고
#   라이다 정면 섹터가 경로 밖을 봐서 감지가 늦는다.
#
# ★ 2026-09-13 배치 변경 — 한 런에서 회피 → 돌발정지 순으로 본다.
#   예전에는 돌발(12~30) → 회피(35~55) 였다. 둘을 맞바꾼 이유는 순전히
#   **조향 override 가 서로 반대**이기 때문이다:
#     · 회피 구간   = lidar_avoid 가 arm 되어야 옆으로 핀다
#     · 돌발 구간   = arm 되면 안 된다 (피하면 미션 실패 10점, '서야' 성공)
#   두 구간이 s 로 갈려 있어야 한 런에서 둘 다 검증된다. 경계는 s 54/55.
#
# ⚠ 이 파일은 **학교 전용**이다. 대회 때는 config/mission_plan.yaml 을 쓴다.
#   시퀀서가 course 블록으로 대조하므로 용인에서 이 파일을 쓰면 즉시 거부된다.

course:
  site: "충주 캠퍼스 학교 트랙 (리허설 전용)"
  waypoints: "config/chungju_school/wp_school_track_0.5.yaml"
  path_length_m: 73.0

missions:
  # ── 돌발 급정지 (직선 구간) ───────────────────────────────────────
  # 규정: 더미 감지 → 완전정지 → **3초 이상** → 재출발.
  #   sudden_stop_node 의 dwell 기본값은 5.0 (규정 3.0 + 여유).
  #   회피로 빠져나가면 미션 실패라 inhibits 로 lidar_avoid 를 막는다.
  - name: sudden_stop
    enabled: true
    arm_topic: /sudden_stop/arm
    done_topic: /sudden_stop/done
    inhibits: [lidar_avoid]
    trigger:
      type: course_s
      # ⚠ 예전엔 8~18 이었는데 8~10 이 캘리브 구간과 겹쳐 동작하지 않았다.
      #   규정상 돌발은 '고정 위치 아님' 이라 구간은 넓게 잡는 게 맞다.
      # 9/13: 회피(39~47) 뒤로 옮겼다. **의자는 s 52 경로 정중앙.**
      #   4m 앞(s 48)에서 감지가 시작되므로 arm 은 s 47 부터여야 한다.
      #   s_exit 를 72 까지 넓게 두는 것은 규정상 돌발이 '고정 위치 아님'
      #   이기 때문이고, 또 의자를 치운 뒤 재출발까지 arm 이 살아 있어야
      #   하기 때문이다.
      # ★ 2026-09-14 00:30 — **나가는 직선(회피보다 앞)** 으로 옮겼다.
      #   ① 47~72 는 회피 구간(38~56)과 **겹쳤다**. 돌발은 inhibits 로
      #      lidar_avoid 를 끄므로, s47 에서 회피가 죽어 s50 의 의자를
      #      못 피한다.
      #   ② 56~73 은 R 7~9m 급커브이고 이 차에서 전원이 가장 약한 구간이다
      #      (조향 부하로 VMIN 3359mV → USB 브라운아웃 실측). 거기서 서고
      #      다시 출발하는 건 실패 확률이 높다.
      #   ③ 2026-09-14: 사용자가 **회피 뒤(s 56 부근)** 에서 보길 원해 그리로
      #      옮겼다. 곡률을 재보니 거기는 아직 완만하다:
      #        s55 R=56m · s56 R=50m · s57 R=42m · s58 R=31m
      #        (급커브는 s60 R=15m, s62 R=9m 부터)
      #      → 더미는 **s 56, 경로 정중앙**. 4m 앞(s 52)에서 감지가 시작되므로
      #        arm 은 s 51 부터. 회피는 s 50 에서 끝나 겹치지 않는다.
      #   ⚠ 여기는 전원이 약해지기 시작하는 구간이다(s56 이후 조향 부하가
      #     커져 VMIN 3359mV·IMU 끊김이 났던 곳). IMU 자동재연결이 받쳐주지만
      #     실패하면 s 18(나가는 직선)로 옮길 것.
      s_enter: 51.0
      s_exit:  70.0
    timeout_s: 25.0
    expected_s: 12.0
    critical: false

  # ── 라이다 조향 회피 (커브 구간 = S자 대용) ───────────────────────
  # ★ exclusive: false — 배경 기능. done 도 타임아웃도 없다.
  #   ⚠ sequencer:=true 면 require_arm_for_steer 가 켜지므로, 이 항목이
  #     arm 하지 않는 구간에서는 **조향 회피가 아예 안 나간다**.
  #     (감속·정지는 안전 기능이라 arm 과 무관하게 항상 동작한다)
  - name: lidar_avoid
    enabled: true
    arm_topic: /lidar/arm
    exclusive: false
    trigger:
      type: course_s
      # 9/13: **회피 장애물은 s 44, 경로에서 좌 또는 우로 0.45m 비껴서.**
      #   ⚠ 커브(s 34~42)에는 두지 않는다. 회피가 뜨면 먹스가 경로조향을
      #     통째로 버리므로, 커브에서 회피를 켜면 그것 자체가 이탈이다.
      #   s_enter 39: 장애물 4m 전(s 40)에 이미 arm 돼 있어야 조향이 나간다.
      #   s_exit  47: 돌발 구간(47~) 시작점. 겹치면 돌발 때 회피가 살아 있어
      #     '피해 버리고' 미션이 실패한다(10점). 의자를 4m 앞에서 보는
      #     시점(s 48)에는 이미 꺼져 있다.
      # 2026-09-13 밤: 의자를 '첫 커브 돌고 직진' 에 놓았다. 정확한 s 를
      #   모르므로 **돌아오는 직선 전체(42~55)** 를 덮되, 4m 앞에서 보는 것을
      #   감안해 앞뒤로 넉넉히 잡는다.
      #   ⚠ 커브(20~42, 55~73)에는 절대 걸치지 않는다 — 거기서 회피가 뜨면
      #     먹스가 경로조향을 버려 가드레일로 밀린다(오늘 실제로 박았다).
      #   2026-09-14: 돌발정지를 s 51 부터 두면서 **s 50 에서 끝낸다.**
      #   겹치면 돌발의 inhibits 가 회피를 꺼버려 의자를 못 피한다.
      #
      # ★ 2026-09-16 — 사용자가 현장에서 차를 세우고 '여기서부터 회피 시작'
      #   이라고 찍은 지점을 실측했다:
      #       mission_s.py --live → s = 40.3m  (-26.29, -25.43, 경로에서 0.01m)
      #   그래서 s_enter 38.0 → 40.0 으로 **좁혔다**. 넓히지 않고 좁힌 이유:
      #     · s38 곡률 R=13.1m (필요조향 1.44°) — 아직 커브 탈출 중이다.
      #       회피가 arm 되면 먹스가 경로조향을 통째로 버리므로, 커브에서
      #       arm 하는 것 자체가 이탈 방향이다.
      #     · s40.3 은 R=23.1m (0.82°) — 사실상 직선. 여기부터가 안전하다.
      #     · s40.0 으로 0.3m 만 앞당겨 arm 지연을 없앴다.
      #
      # ★★ 2026-09-17 — 40.0 → 37.0. **첫 장애물에 계속 박던 원인이 이것이다.**
      #
      #   drive_0126 실측. 라이다는 의자를 진작 보고 회피각까지 정해 뒀는데,
      #   구간 밖이라 먹스가 그 각을 **쓰지 못하게 막혀 있었다**:
      #       t80.95  s=38.6  AVOID(조향OFF)|RIGHT   ← 이미 회피 판정
      #       t81.35  s=39.0  AVOID(조향OFF)|LEFT
      #       t82.75  s=40.3  AVOID(조향OFF)|LEFT    ← 2.0초(1.87m) 내내 조향OFF
      #       t82.95  s=40.5  BLOCKED|STOP           ← arm 되는 순간 obs 2.04m
      #   정면 장애물은 **2.8m 안에 들면 무조건 BLOCKED** 다(안전버블 asin(0.6375/r)
      #   이 조준창 20.6° 를 통째로 덮는다). BLOCKED 는 조향을 아예 안 내므로
      #   (NaN) 차는 경로대로 직진해 그대로 박는다. **빠져나올 길이 없었다.**
      #
      #   감지 문제가 아니라 **arm 시점 문제**다. 감지는 s38.6 에 이미 끝났다.
      #   그래서 감지보다 앞선 s37 로 옮긴다.
      #
      #   커브 위험은 재 봤다 (wp 파일 곡률):
      #       s35 R= 8.1m(5.51°)   s36 R= 9.4m(4.78°)   ← 여기부터는 경계
      #       s37 R=11.0m(4.08°)   s38 R=13.4m(3.35°)
      #       s40 R=21.8m(2.06°)   ← 예전 값
      #     AVOID 중에는 먹스가 경로조향을 버리므로 커브에서 arm 하면 그만큼
      #     이탈한다. s37(R=11m)에서 2m 동안 최악이 0.18m — 경고선 0.72m 의 1/4.
      #     ⚠ **s35 아래로는 내리지 말 것.** 급커브(s33 R=6.4m)에 걸린다.
      #
      #   되돌리려면 이 값을 40.0 으로 바꾸면 된다(다른 것은 안 건드렸다).
      s_enter: 37.0
      s_exit:  50.0
    critical: false
